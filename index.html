<style>
:root{--bg:#f5f5f7;--c:#fff;--t:#1d1d1f;--m:#6e6e73;--l:#e5e5ea;--a:#007aff;--r:#ff3b30;--g:#2e7d32;--w:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--c:#1c1c1e;--t:#f5f5f7;--m:#98989d;--l:#38383a;--a:#0a84ff;--r:#ff453a;--g:#66bb6a;--w:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--c:#1c1c1e;--t:#f5f5f7;--m:#98989d;--l:#38383a;--a:#0a84ff;--r:#ff453a;--g:#66bb6a;--w:#fbbf24;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#app{max-width:480px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:30px;margin:8px 0 2px}h2{font-size:20px;margin:0}h3{font-size:15px;margin:14px 0 4px}
.m{color:var(--m);font-size:13px}
.card{background:var(--c);border:1px solid var(--l);border-radius:18px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between;margin-top:14px}.sp>*{flex:1}
.ic{font-size:28px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 14px;border:0;border-radius:14px;background:var(--a);color:#fff;font:inherit;font-weight:700;width:100%;text-decoration:none;margin-top:8px;cursor:pointer}
.btn.r{background:var(--r)}.btn.g{background:var(--g)}.btn.o{background:transparent;color:var(--t);border:1px solid var(--l)}.btn.big{min-height:64px;font-size:19px}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--l);border-radius:12px;background:var(--c);color:var(--t);font:inherit}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;padding-bottom:4px}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--l);background:var(--c);color:var(--t);font:inherit;font-size:14px;cursor:pointer}.chip.on{background:var(--t);color:var(--bg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{min-height:96px;border-radius:18px;border:1px solid var(--l);background:var(--c);color:var(--t);font:inherit;font-weight:700;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}.tile span{font-size:32px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.x{border:0;background:var(--c);color:var(--t);width:40px;height:40px;border-radius:20px;font-size:18px;cursor:pointer;border:1px solid var(--l)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--l);font-size:15px}.kv span{color:var(--m)}
.acts{margin-top:6px}ul{margin:4px 0;padding-inline-start:20px}li{margin:2px 0}
.b{font-size:12px;font-weight:700}
img.at{max-width:100%;border-radius:10px;margin:6px 0;border:1px solid var(--l)}
.fab{position:fixed;inset-inline-end:max(16px,calc(50% - 224px));bottom:calc(20px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:30px;border:0;background:var(--a);color:#fff;font-size:32px;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer}
.lock{text-align:center;padding-top:12vh}.lock input{margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#000;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
</style></head><body>
<div id="app"></div><div id="t" class="toast"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=new TextEncoder(),dec=new TextDecoder();
const b64=b=>{let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const keyOf=async(pw,s)=>{const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:s,iterations:300000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])};
const db=()=>new Promise((ok,no)=>{const r=indexedDB.open('kaspet',1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>ok(r.result);r.onerror=no});
const idbGet=async k=>{const d=await db();return new Promise((ok,no)=>{const q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>ok(q.result);q.onerror=no})};
const idbSet=async(k,v)=>{const d=await db();return new Promise((ok,no)=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,k);t.oncomplete=ok;t.onerror=no})};
const T={'רכב':'🚗','דירה':'🏠','בריאות':'🩺','חיים':'❤️','נסיעות':'✈️','תאונות':'🛡️','אחר':'📄'};
const CO=['הראל','מגדל','הפניקס','כלל','מנורה','AIG','שירביט','ביטוח ישיר','הכשרה','איילון','ליברה','כללית','מכבי','מאוחדת','לאומית'];
const FL=[['co','חברת ביטוח'],['num','מספר פוליסה'],['asset','פריט מבוטח (מס׳ רכב, כתובת, שם המבוטח)'],['end','תוקף עד','date'],['prem','פרמיה (₪)','number'],['ded','השתתפות עצמית'],['cl','טלפון מוקד תביעות','tel'],['agn','שם הסוכן'],['ag','טלפון הסוכן','tel'],['prod','שם המוצר / התכנית'],['start','תחילת תוקף','date'],['who','מבוטחים / נהגים'],['notice','מועד חובה להודיע על אירוע']];
let REM=false,DR=null,EVT='',EVR='',S={p:[]},K=null,salt=null,R=null,V='home',F='',Q='',cur=null,edit=null,SO='',FA=[],DEL=null,H=0;
const toast=t=>{const e=$('#t');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2400)};
const P=id=>S.p.find(x=>x.id===id);
const cp=async t=>{try{await navigator.clipboard.writeText(t);toast('הועתק')}catch(e){toast('ההעתקה נחסמה בדפדפן')}};
const ph=x=>String(x||'').replace(/[^\d+*#]/g,'');
const wa=x=>{x=ph(x);return 'https://wa.me/'+(x[0]==='0'?'972'+x.slice(1):x.replace('+',''))};
const dl=d=>d?Math.round((new Date(d)-new Date().setHours(0,0,0,0))/864e5):null;
const badge=p=>{const n=dl(p.end);if(n===null)return'';return n<0?'<span class="b" style="color:var(--r)">פגה</span>':n<=45?`<span class="b" style="color:var(--w)">נותרו ${n} ימים</span>`:`<span class="b" style="color:var(--g)">עד ${esc(p.end)}</span>`};
const ul=t=>`<ul>${String(t).split('\n').filter(Boolean).map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`;
const hay=p=>[p.co,p.num,p.asset,p.type,p.prod,p.who,p.notice,p.cov,p.ex,p.note,p.steps,p.docs,p.ph,p.full,p.agn].join(' ');
const NQ=s=>String(s==null?'':s).toLowerCase().replace(/[\u0591-\u05c7\u05f3\u05f4'"]/g,'').replace(/[-–—_,.():]/g,' ').replace(/\s+/g,' ');
const SW=['של','את','על','עם','קרה','לי','אני','היה','הוא','זה','מה','אם','גם','לא','כי','או','אל','יש','כל'];
const SY=[['מים','נזילה','צנרת','הצפה','רטיבות','צינור','סתימה'],['גניבה','פריצה','שוד','גנבו'],['אש','שריפה','עשן'],['תאונה','התנגשות','פגיעה','נזק עצמי','צד ג'],['גרירה','תקר','פנצר','מצבר','חילוץ'],['שמשה','חלון','זכוכית'],['ניתוח','אשפוז','רופא','תרופה','שיניים','בדיקה','מומחה'],['טיסה','מזוודה','כבודה','ביטול','חול'],['פטירה','מוות','נכות','מחלה קשה','אובדן כושר']];
const xp=w=>SY.find(g=>g.some(t=>w===t||(t.length>2&&(w.includes(t)||(w.length>2&&t.includes(w))))))||[w];
const lsearch=(q,L)=>{const ws=NQ(q).split(' ').filter(w=>w.length>1&&!SW.includes(w));if(!ws.length)return L.map(p=>({p,s:[]}));const ts=ws.flatMap(xp);
 return L.map(p=>{const h=NQ(hay(p)),sc=ws.filter(w=>xp(w).some(t=>h.includes(t))).length;if(!sc)return null;const s=[p.cov,p.ex,p.full,p.steps,p.docs,p.note].join('\n').split('\n').filter(l=>l.trim()&&ts.some(t=>NQ(l).includes(t))).slice(0,5);return{p,s,sc}}).filter(Boolean).sort((a,b)=>b.sc-a.sc)};
const phs=p=>String(p.ph||'').split('\n').filter(Boolean).map(l=>{const m=l.match(/\*?\d[\d\- ]{2,}\d/);return m?`<a class="btn o" href="tel:${ph(m[0])}">📞 ${esc(l)}</a>`:`<div class="m">${esc(l)}</div>`}).join('');
const imV=()=>bar('ייבוא פוליסה')+`<p class="m">שלח ל-Claude בצ׳אט את הפוליסה (PDF או תמונה) וכתוב: חלץ לכספת. הדבק כאן את ה-JSON שתקבל.</p><textarea id="imt" rows="10"></textarea><button class="btn" onclick="imp()">ייבא לכספת</button>`;
async function imp(){try{const m=$('#imt').value.match(/[\[{][\s\S]*[\]}]/);let o=JSON.parse(m[0]);o=Array.isArray(o)?o:[o];const L=x=>Array.isArray(x)?x.join('\n'):x==null?'':String(x);
 for(const x of o)S.p.unshift({id:Date.now()+''+Math.floor(Math.random()*1e4),type:T[x.type]?x.type:'אחר',co:L(x.co),num:L(x.num),asset:L(x.asset),end:L(x.end),prem:L(x.prem),ded:L(x.ded),cl:L(x.cl),agn:L(x.agn),ag:L(x.ag),prod:L(x.prod),start:L(x.start),who:L(x.who),notice:L(x.notice),cov:L(x.cov),ex:L(x.ex),note:L(x.note),steps:L(x.steps),docs:L(x.docs),ph:L(x.ph),full:L(x.full),f:[]});
 await save();toast('יובאו '+o.length+' פוליסות');nav('home')}catch(e){toast('ה-JSON לא תקין')}}
function evl(){const t=$('#evt').value.trim(),r=$('#evr');EVT=t;const x=lsearch(t,S.p);EVR=x.length?x.map(y=>`<div class="card"><b>${T[y.p.type]||''} ${esc(y.p.co)}</b>${y.s.map(l=>`<div class="m">• ${esc(l)}</div>`).join('')}</div>`+card(y.p)).join(''):'<p class="m">לא נמצא בכספת. נסה ניתוח מעמיק עם Claude.</p>';r.innerHTML=EVR}

async function save(){try{const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},K,enc.encode(JSON.stringify(S)));await idbSet('v',{s:b64(salt),i:b64(iv),d:b64(ct)})}catch(e){toast('השמירה נכשלה - האחסון בדפדפן לא זמין')}}
async function go(){const pw=$('#pw').value,er=$('#er');if(pw.length<6){er.textContent='לפחות 6 תווים';return}
 let r=null;try{r=await idbGet('v')}catch(e){}
 try{if(!r){const p2=$('#pw2');if(p2&&p2.value!==pw){er.textContent='הסיסמאות לא זהות';return}salt=crypto.getRandomValues(new Uint8Array(16));K=await keyOf(pw,salt);S={p:[]};await save();R=true}
 else{salt=ub(r.s);K=await keyOf(pw,salt);S=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(r.i)},K,ub(r.d))))}}
 catch(e){K=null;er.textContent='סיסמה שגויה';return}
 try{navigator.storage.persist()}catch(e){}REM=!!($('#rm')&&$('#rm').checked);try{await idbSet('dk',REM?K:null)}catch(e){REM=false}V='home';render()}
async function lock(){try{await idbSet('dk',null)}catch(e){}REM=false;K=null;S={p:[]};V='home';try{R=await idbGet('v')||R}catch(e){}render()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)H=Date.now();else if(K&&!REM&&Date.now()-H>120000)lock()});

const nav=v=>{if(v==='home')DR=null;V=v;render()};
const bar=(t,b='home')=>`<div class="bar"><button class="x" onclick="nav('${b}')">→</button><h2>${t}</h2></div>`;
const chip=(l,t)=>`<button class="chip${F===t?' on':''}" onclick="F='${t}';render()">${l}</button>`;

function item(p,ls=[]){
 return `<div class="card" onclick="cur='${p.id}';nav('p')"><div class="row"><span class="ic">${T[p.type]||'📄'}</span><div style="flex:1"><b>${esc(p.co)}</b> · ${esc(p.type)}<div class="m">${esc(p.asset||p.num)}</div></div>${badge(p)}</div>${ls.map(l=>`<div class="m">• ${esc(l)}</div>`).join('')}</div>`}
function listH(){if(!S.p.length)return '<div class="card" style="text-align:center"><div style="font-size:40px">📭</div><b>הכספת ריקה</b><div class="m">לחץ על ＋ כדי להוסיף את הפוליסה הראשונה</div></div>';
 const r=lsearch(Q,S.p.filter(p=>!F||p.type===F));return r.length?r.map(x=>item(x.p,x.s)).join(''):'<p class="m">לא נמצאו תוצאות</p>'}
const list=()=>{$('#list').innerHTML=listH()};

function home(){const ts=[...new Set(S.p.map(p=>p.type))],ex=S.p.filter(p=>{const n=dl(p.end);return n!==null&&n<=45}).length;
 return `<h1>כספת ביטוח</h1><div class="m">${S.p.length} פוליסות${ex?` · ${ex} פוקעות או פגו`:''}</div>
<button class="btn r big" style="margin-top:14px" onclick="SO='';nav('sos')">🚨 קרה משהו? שלוף פוליסה</button><button class="btn big" onclick="$('#sf').click()">📷 הוסף פוליסה אוטומטית (סריקה)</button><input id="sf" type="file" accept="image/*,application/pdf" multiple hidden onchange="scan(this)"><button class="btn o" onclick="nav('im')">📥 ייבוא פוליסה מ-Claude (הדבק)</button><div id="ss" class="m" style="margin-top:6px"></div>${S.p.length&&!(S.bk&&Date.now()-S.bk<12096e5)?`<div class="card" style="border-color:var(--w)">⚠️ אין גיבוי עדכני. הנתונים נשמרים רק בדפדפן הזה.<button class="btn o" onclick="nav('bk')">גבה עכשיו</button></div>`:''}
<input id="q" style="margin-top:12px" placeholder="חיפוש: מים, גרירה, מספר פוליסה…" value="${esc(Q)}" oninput="Q=this.value;list()">
<div class="chips">${chip('הכל','')}${ts.map(t=>chip((T[t]||'')+' '+t,t)).join('')}</div>
<div id="list">${listH()}</div>
<div class="row sp"><button class="btn o" onclick="nav('bk')">גיבוי ושחזור</button><button class="btn o" onclick="nav('st')">⚙️ הגדרות AI</button><button class="btn o" onclick="lock()">🔒 נעל</button></div>
<button class="fab" aria-label="הוסף פוליסה" onclick="edit=null;nav('f')">＋</button>`}

function sosV(){const ts=[...new Set(S.p.map(p=>p.type))];
 if(!SO)return bar('קרה משהו?')+evBox()+(ts.length?`<p class="m">מה סוג האירוע?</p><div class="grid">${ts.map(t=>`<button class="tile" onclick="SO='${t}';render()"><span>${T[t]||'📄'}</span>${t}</button>`).join('')}</div>`:'<p class="m">אין עדיין פוליסות בכספת.</p>');
 return `<div class="bar"><button class="x" onclick="SO='';render()">→</button><h2>${T[SO]||''} ${esc(SO)}</h2></div>`+S.p.filter(p=>p.type===SO).map(p=>card(p)).join('')}

function card(p,d){if(!p)return'';
 const kv=(l,v,c)=>v?`<div class="kv"${c?` onclick="cp(P('${p.id}').${c})"`:''}><span>${l}</span><b>${esc(v)}${c?' ⧉':''}</b></div>`:'';
 return `<div class="card"><div class="row"><span class="ic">${T[p.type]||'📄'}</span><div style="flex:1"><b>${esc(p.co)}</b> · ${esc(p.type)}<div class="m">${esc(p.asset)}</div></div>${badge(p)}</div>
${kv('מספר פוליסה',p.num,'num')}${kv('השתתפות עצמית',p.ded)}${kv('פרמיה',p.prem?p.prem+' ₪':'')}${kv('סוכן',p.agn)}${kv('מוצר',p.prod)}${kv('מבוטחים',p.who)}${p.notice?`<div class="card" style="border-color:var(--w)"><b>⏱ חובה להודיע:</b> ${esc(p.notice)}</div>`:''}
<div class="acts">${p.cl?`<a class="btn r" href="tel:${ph(p.cl)}">📞 מוקד תביעות</a>`:''}${p.ag?`<a class="btn g" href="tel:${ph(p.ag)}">📞 התקשר לסוכן</a><a class="btn o" target="_blank" rel="noopener" href="${wa(p.ag)}">וואטסאפ לסוכן</a>`:''}<button class="btn" onclick="cur='${p.id}';nav('cl')">✍️ הפק כתב תביעה</button><button class="btn o" onclick="cs('${p.id}')">העתק סיכום לתביעה</button>${phs(p)}</div>
