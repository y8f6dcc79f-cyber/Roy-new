  for(const a0 of c.a){const a=coNorm(a0);if(!a)continue;let at=-1,count=0,from=0;while((at=z.indexOf(a,from))!==-1&&count<8){count++;from=at+a.length;const near=z.slice(Math.max(0,at-90),Math.min(z.length,at+a.length+90));const nearHead=at<1800;const labelled=ctx.some(k=>near.includes(coNorm(k)));const legal=near.includes('בעמ')||near.includes('חברה לביטוח');let v=(a.length>=12?3:2)+Math.min(count-1,2);if(labelled)v+=5;if(legal)v+=3;if(nearHead)v+=1;if(v>score){score=v;evidence=t.slice(Math.max(0,at-55),Math.min(t.length,at+a.length+55)).replace(/\s+/g,' ').trim()}}
  }

 }
 hits.sort((a,b)=>b.score-a.score);

 if(h>lt){const runs=[];let cur='';for(const z of r.a){if(HB.test(z.s)){if(cur.trim())runs.push(cur.trim());cur='';if(z.s.trim())runs.push(z.s.trim())}else cur+=z.s}if(cur.trim())runs.push(cur.trim());t+=runs.reverse().join(' ')+'
'}
 else t+=r.a.map(z=>z.s).join(' ').replace(/\s+/g,' ').trim()+'
'}return t}
async function pdfText(f){const d=await pdfDoc(f);let t='';for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent(),rows=[];
 for(const it of c.items){if(!it.str)continue;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,a:[]};rows.push(r)}r.a.push({x,s:it.str})}
 t+=rowsToText(rows)}return t}
async function ocrImg(u,st){await need('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');return(await Tesseract.recognize(u,'heb+eng',{logger:m=>{if(m.status==='recognizing text')st.textContent='קורא טקסט מהתמונה… '+Math.round(m.progress*100)+'%'}})).data.text}
async function pdfOcr(f,st){const d=await pdfDoc(f);let t='';for(let i=1;i<=Math.min(d.numPages,50);i++){const g=await d.getPage(i),v=g.getViewport({scale:2}),c=document.createElement('canvas');c.width=v.width;c.height=v.height;await g.render({canvasContext:c.getContext('2d'),viewport:v}).promise;t+=await ocrImg(c.toDataURL('image/jpeg',.8),st)+'
'}return t}

function analyzePolicy(id){
 const p=P(id),q=$('#scenario-'+id)?.value||'';if(!p||!q.trim()){toast('תאר את המקרה שברצונך לבדוק');return}
 const lines=splitPolicyLines(p),lower=q.toLowerCase(),terms=scenarioMap.filter(g=>g[1].some(w=>lower.includes(w))).flatMap(g=>g[1]);
 const words=[...new Set((lower.match(/[א-ת]{3,}|[a-z]{3,}/g)||[]).filter(w=>!['האם','אני','שלי','היה','קרה','בגלל','במקרה','כמה','יכול','יכולה','הפוליסה'].includes(w)))];
 const hits=lines.map(line=>({line,score:terms.filter(w=>line.toLowerCase().includes(w)).length*3+words.filter(w=>line.toLowerCase().includes(w)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,10).map(x=>x.line);
 const limits=lines.filter(l=>/(עד|גבול אחריות|סכום ביטוח|תקרת|מקסימום).{0,50}(₪|ש["״]?ח|\d{4,})/i.test(l)).slice(0,8);
 const deduct=lines.filter(l=>/השתתפות עצמית/i.test(l)).slice(0,6);
 const exclusions=lines.filter(l=>/חריג|לא יכוס|אינו מכוס|מוחרג|למעט|לא תחול|לא יהיה כיסוי|בלאי|מעשה מכוון/i.test(l)).slice(0,8);
 const conditions=lines.filter(l=>/ובלבד|בתנאי|מותנה|חובה|יש להודיע|הודעה|אישור מראש|בתקופת הביטוח/i.test(l)).slice(0,8);

 $('#analysis-'+id).innerHTML=html;
}
