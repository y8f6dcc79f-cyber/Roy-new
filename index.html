:root{
  --bg:#F2F2F7;
  --c:#FFFFFF;
  --t:#000000;
  --m:#8A8A8E;
  --l:#E8EAED;
  --a:#0A84FF;
  --r:#FF3B30;
  --g:#34C759;
  --w:#FF9500;
  --input:#EFEFF1;
  --soft:#F2F2F7;
  box-sizing:border-box
}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#000000;
    --c:#1C1C1E;
    --t:#FFFFFF;
    --m:#98989D;
    --l:#2C2C2E;
    --a:#0A84FF;
    --r:#FF453A;
    --g:#34C759;
    --w:#FF9F0A;
    --input:#2C2C2E;
    --soft:#2C2C2E;
    color-scheme:dark
  }
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--t);
  font:15px/1.5 -apple-system,"SF Pro Display","Heebo","Segoe UI",sans-serif
}

body{
  direction:rtl;
  text-align:right
}

h1{
  font-size:28px;
  line-height:1.15;
  letter-spacing:-.5px;
  font-weight:800;
  margin:0 0 4px
}

h2{
  font-size:20px;
  letter-spacing:-.3px;
  font-weight:700;
  margin:0
}

h3{
  font-size:17px;
  font-weight:600;
  margin:18px 0 6px
}

.ltr{
  direction:ltr;
  unicode-bidi:isolate;
  text-align:left
}

.num{
  font-variant-numeric:tabular-nums;
  direction:ltr;
  unicode-bidi:isolate;
  white-space:nowrap
}

.kv{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  padding:11px 0;
  border-top:1px solid var(--l);
  font-size:15px;
  text-align:right
}

.kv>span{
  color:var(--m);
  flex:none;
  font-size:14px
}

.kv>b{
  font-weight:600;
  text-align:left;
  min-width:0;
  overflow-wrap:anywhere
}

.kv b .ltr{
  display:inline-block
}

.card{
  background:var(--c);
  border:1px solid var(--l);
  border-radius:20px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)
}

.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  min-height:48px;
  padding:0 14px;
  border:0;
  border-radius:14px;
  background:var(--a);
  color:#fff;
  font:inherit;
  font-weight:600;
  font-size:15px;
  width:100%;
  text-decoration:none;
  margin-top:8px;
  cursor:pointer
}

.btn:active{
  opacity:.82
}

.btn.r{
  background:var(--r)
}

.btn.g{
  background:var(--g)
}

.btn.o{
  background:var(--soft);
  color:var(--t);
  border:1px solid transparent
}

.btn.soft-red{
  background:rgba(255,59,48,.1);
  color:var(--r)
}

.btn.soft-blue{
  background:rgba(10,132,255,.1);
  color:var(--a)
}

@media(prefers-color-scheme:dark){
  .btn.soft-red{
    background:rgba(255,69,58,.18)
  }

  .btn.soft-blue{
    background:rgba(10,132,255,.22)
  }
}

.btn.big{
  min-height:52px;
  font-size:16px
}

.btn:disabled{
  opacity:.45;
  cursor:default
}

input,select,textarea{
  width:100%;
  min-height:48px;
  padding:11px 12px;
  border:1px solid transparent;
  border-radius:12px;
  background:var(--input);
  color:var(--t);
  font:inherit;
  outline:none
}

input:focus,select:focus,textarea:focus{
  border-color:var(--a);
  box-shadow:0 0 0 3px rgba(10,132,255,.16);
  background:var(--c)
}

textarea{
  line-height:1.6
}

label{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:12.5px;
  font-weight:500;
  color:var(--m);
  margin:14px 0 5px
}

.check-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--w);
  display:inline-block;
  flex:none
}

.chips{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin:12px -20px;
  padding:2px 20px 6px;
  scrollbar-width:none
}

.chips::-webkit-scrollbar{
  display:none
}

.chip{
  flex:none;
  min-height:34px;
  padding:0 14px;
  border-radius:999px;
  border:1px solid transparent;
  background:var(--input);
  color:var(--t);
  font:inherit;
  font-size:14px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap
}

.chip.on{
  background:var(--t);
  color:var(--bg)
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.tile{
  min-height:96px;
  border-radius:20px;
  border:1px solid var(--l);
  background:var(--c);
  color:var(--t);
  font:inherit;
  font-weight:600;
  font-size:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.04)
}

.bar{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:8px
}

.x{
  border:1px solid var(--l);
  background:var(--c);
  color:var(--t);
  width:40px;
  height:40px;
  border-radius:20px;
  font-size:18px;
  cursor:pointer;
  flex:none
}

.m{
  color:var(--m);
  font-size:12.5px;
  font-weight:500;
  line-height:1.5
}

.pill{
  display:inline-flex;
  align-items:center;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  border:0;
  white-space:nowrap
}

.pill.ok{
  background:rgba(52,199,89,.14);
  color:var(--g)
}

.pill.warn{
  background:rgba(255,149,0,.14);
  color:var(--w)
}

.pill.bad{
  background:rgba(255,59,48,.12);
  color:var(--r)
}

.phs a{
  margin-top:8px
}

ul{
  margin:4px 0;
  padding-inline-start:20px
}

li{
  margin:4px 0
}

img.at{
  max-width:100%;
  border-radius:12px;
  margin:6px 0;
  border:1px solid var(--l)
}

.toast{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:calc(104px + env(safe-area-inset-bottom,0px));
  background:#000;
  color:#fff;
  padding:10px 16px;
  border-radius:20px;
  font-size:14px;
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
  z-index:50;
  max-width:90vw;
  text-align:center
}

@media(prefers-color-scheme:dark){
  .toast{
    background:#fff;
    color:#000
  }
}

.ev{
  background:var(--soft);
  border:0;
  border-radius:10px;
  padding:8px 10px;
  margin:6px 0;
  font-size:13px
}

.extracted{
  unicode-bidi:plaintext;
  direction:auto;
  text-align:right;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:13px;
  line-height:1.7
}

.line-no{
  color:var(--m);
  display:inline-block;
  min-width:28px;
  text-align:left;
  margin-inline-end:8px;
  -webkit-user-select:none;
     -moz-user-select:none;
          user-select:none
}

.av{
  width:48px;
  height:48px;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-weight:700;
  font-size:19px;
  flex:none
}

.hero{
  background:var(--c);
  border:1px solid var(--l);
  border-radius:20px;
  padding:20px;
  margin:14px 0;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)
}

.hero-value{
  font-size:34px;
  line-height:1.1;
  font-weight:800;
  letter-spacing:-.5px
}

.hero-stats{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
  margin-top:18px;
  padding-top:16px;
  border-top:1px solid var(--l)
}

.hero-stat b{
  display:block;
  font-size:17px;
  font-weight:700
}

.hero-stat span{
  font-size:12.5px;
  color:var(--m);
  font-weight:500
}

.rowlink{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  background:var(--c);
  border:1px solid var(--l);
  border-radius:20px;
  padding:14px 16px;
  margin:8px 0;
  font:inherit;
  color:var(--t);
  cursor:pointer;
  text-align:right;
  box-shadow:0 1px 2px rgba(0,0,0,.04)
}

.rowlink:active{
  opacity:.8
}

.row-icon{
  width:36px;
  height:36px;
  border-radius:18px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  flex:none
}

.rowlink .arrow{
  margin-inline-start:auto;
  color:var(--m);
  font-size:18px
}

.search{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--input);
  border-radius:12px;
  padding:0 12px;
  margin:14px 0
}

.search input{
  background:transparent;
  border:0;
  box-shadow:none!important;
  padding-inline:0
}

.search input:focus{
  background:transparent
}

.progress{
  height:4px;
  background:var(--input);
  border-radius:99px;
  overflow:hidden;
  margin-top:8px
}

.progress i{
  display:block;
  height:100%;
  border-radius:99px;
  background:var(--a)
}

.policy-row{
  display:flex;
  gap:12px;
  align-items:center;
  cursor:pointer
}

.tabbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  background:var(--c);
  border-top:1px solid var(--l);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  display:flex;
  justify-content:space-around;
  align-items:flex-end
}

.tab{
  flex:1;
  max-width:96px;
  border:0;
  background:transparent;
  color:var(--m);
  font:inherit;
  font-size:11px;
  font-weight:500;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:3px;
  cursor:pointer;
  padding:4px 0
}

.tab.on{
  color:var(--a)
}

.tab-ico{
  font-size:20px;
  line-height:1
}

.tab-add{
  width:52px;
  height:52px;
  border-radius:26px;
  background:var(--a);
  color:#fff;
  border:0;
  font-size:26px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  margin-top:-26px;
  box-shadow:0 6px 16px rgba(10,132,255,.35)
}

.lock-ico{
  width:76px;
  height:76px;
  border-radius:38px;
  background:var(--soft);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  margin:0 auto 18px
}

.call{
  border:0;
  background:var(--soft);
  color:var(--t);
  border-radius:12px;
  padding:9px 12px;
  font:inherit;
  font-size:14px;
  font-weight:600;
  cursor:pointer
}

button{
  font-family:inherit
}
